version: '3.8'

services:
  mariadb-db:
    image: mariadb:latest
    container_name: mariadb-usuarios
    restart: always
    environment:
      - MARIADB_DATABASE=usuarios_db
      - MARIADB_USER=usuario_test
      - MARIADB_PASSWORD=1234
      - MARIADB_ROOT_PASSWORD=1234
    ports:
      - "3311:3306"
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql
    networks:
      - lafachada-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s 
      retries: 5 

  app-usuarios:
    build: .
    container_name: microservicio-usuarios
    restart: always
    depends_on:
      mariadb-db:
        condition: service_healthy
    environment:
      # Conexión mapeada exactamente para tu application.properties
      - DB_HOST=mariadb-db
      - DB_PORT=3306
      - DB_NAME=usuarios_db
      - DB_USER=root
      - DB_PASSWORD=1234
      - JWT_SECRET=${JWT_SECRET}
      # Variables de AWS requeridas por tu aplicación
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=${AWS_REGION}
    ports:
      - "8083:8083"
    networks:
      - lafachada-network

volumes:
  mariadb_usuarios_data:

networks:
  lafachada-network:
    external: true


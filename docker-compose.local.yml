services:
  mariadb-db:
    image: mariadb:latest
    container_name: mariadb-usuarios
    restart: always
    environment:
      MARIADB_DATABASE: usuarios_db
      MARIADB_USER: usuario_test
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "3307:3306"
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql
    networks:
      - lafachada-network
    healthcheck:
      test: ["CMD", "healthcheck.sh" ,"--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s 
      retries: 5 

  app-usuarios:
    build: .
    container_name: microservicio-usuarios
    restart: always
    depends_on:
      mariadb-db:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb-db:3306/usuarios_db
      - SPRING_DATASOURCE_USERNAME=usuario_test
      - SPRING_DATASOURCE_PASSWORD=1234
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "8083:8083"
    networks:
      - lafachada-network

volumes:
  mariadb_usuarios_data:

networks:
  lafachada-network:
    external: true

version: '3.8'

services:
  mariadb-db:
    image: mariadb:latest
    container_name: mariadb-usuarios
    restart: always
    environment:
      - MARIADB_DATABASE=usuarios_db
      - MARIADB_USER=usuario_test
      - MARIADB_PASSWORD=1234
      - MARIADB_ROOT_PASSWORD=1234
    ports:
      - "3311:3306"
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql
    networks:
      - lafachada-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s 
      retries: 5 

  app-usuarios:
    build: .
    container_name: microservicio-usuarios
    restart: always
    depends_on:
      mariadb-db:
        condition: service_healthy
    environment:
      # Sobrescribimos directamente las propiedades nativas de Spring para saltarnos el application.properties
      - spring.profiles.active=dev
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb-db:3306/usuariosdb?createDatabaseIfNotExist=true&sslMode=trust
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=1234
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
      - AWS_REGION=${AWS_REGION}
    ports:
      - "8083:8083"
    networks:
      - lafachada-network
 

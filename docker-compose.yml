version: '3.8'

services:
  mariadb-db:
    image: mariadb:latest
    container_name: mariadb-usuarios
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: usuarios_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_usuarios_data:/var/lib/mysql

  app-usuarios:
    build: .
    container_name: microservicio-usuarios
    restart: always
    depends_on:
      - mariadb-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb-db:3306/usuarios_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASS}
    ports:
      - "8081:8081"

volumes:
  mariadb_usuarios_data:
name: CI/CD Pipeline - Usuarios services

on:
  push:
    branches: [ "deploy" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Correr Tests y Compilar JAR

      run: mvn clean package -Dspring.profiles.active=test
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET}}


    - name: Subir JAR temporalmente como artefacto

      uses: actions/upload-artifact@v4
      with:
        name: usuarios-jar
        path: target/usuarios-0.0.1-SNAPSHOT.jar


  build-and-push-docker:
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
    - name: Descargar código fuente
      uses: actions/checkout@v4

    - name: Descargar el JAR compilado en el Job anterior
      uses: actions/download-artifact@v4
      with:
        name: usuarios-jar
        path: target/

    - name: Iniciar sesión en Docker Hub (o AWS ECR)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y Subir imagen Docker
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true

        tags: ordiaz/servicio_usuarios:latest

  deploy-to-ecs:
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    steps:
      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - name: Actualizar ECS
        run: |
          aws ecs update-service \
          --cluster fullstack3 \
          --service usuarios-task-service-z53l2hjl \
          --force-new-deployment
